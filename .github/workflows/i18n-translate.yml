name: i18n — автоматичен превод

# public/i18n/<език>/: лендингът и приложението на новите езици (от ръчните речници) и дългите
# текстове на доклада (scripts/irismap-auto.keys.json → irismap-auto.json) на всички езици, с Gemini.
# Преведеното не се пипа — може да се пуска многократно. Резултатът се записва обратно в клона.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: 'Езици, със запетая'
        default: 'en,de,es,fr,it,pt,tr,pl,ro,ru'
      model:
        description: 'Модел'
        default: 'gemini-3.6-flash'
  push:
    branches: [claude/jolly-goodall-obbojn]
    paths: ['.github/workflows/i18n-translate.yml', 'scripts/irismap-auto.keys.json']

permissions:
  contents: write

jobs:
  langs:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - id: l
        run: echo "list=$(echo '${{ inputs.langs || 'en,de,es,fr,it,pt,tr,pl,ro,ru' }}' | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"

  translate:
    needs: langs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.langs.outputs.list) }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODEL: ${{ inputs.model || 'gemini-3.6-flash' }}
      PRODUCT: 'IrisMap, an iris-analysis app that gives a personal nutrition, supplement and lifestyle protocol (part of Eatologix)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Лендинг и приложение
        if: matrix.lang != 'en'
        run: node scripts/i18n-translate-dicts.mjs --lang ${{ matrix.lang }} --dir public/i18n --ref en --model "$MODEL" --product "$PRODUCT" --register formal
      - name: Текстовете на доклада
        run: node scripts/i18n-translate-dicts.mjs --lang ${{ matrix.lang }} --dir public/i18n --keys scripts/irismap-auto.keys.json --out irismap-auto --model "$MODEL" --product "$PRODUCT" --register formal
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ matrix.lang }}
          path: public/i18n/${{ matrix.lang }}/

  commit:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: _i18n }
      - name: Запис в клона
        run: |
          for d in _i18n/i18n-*; do l=${d#_i18n/i18n-}; mkdir -p public/i18n/$l; cp -r $d/* public/i18n/$l/; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/i18n
          git diff --cached --quiet && { echo "Няма промени."; exit 0; }
          git commit -m "i18n: автоматичен превод (${{ inputs.langs || 'всички езици' }})"
          git push origin HEAD:${{ github.ref_name }}
